# Dependabot will run on day 2 of each month at 02:24 (Europe/Berlin timezone)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "24 2 2 * *"
    open-pull-requests-limit: 20
    assignees:
      - "gaudes"
    versioning-strategy: "increase"
